[package]
name = "firm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
pi-canary = []

[[bin]]
name = "firm"
path = "src/main.rs"

[dependencies]
harness_core = { package = "firm-core", path = "../firm-core" }
harness_store = { package = "firm-store", path = "../firm-store" }
harness_fabric = { package = "firm-fabric", path = "../firm-fabric" }
harness_workflow = { package = "firm-workflow", path = "../firm-workflow" }
harness_governance = { package = "firm-governance", path = "../firm-governance" }
harness_provider_events = { package = "firm-provider-events", path = "../firm-provider-events" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
crossbeam = "0.8"
notify = "6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
