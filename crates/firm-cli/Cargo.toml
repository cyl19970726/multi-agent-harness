[package]
name = "firm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
pi-canary = []

[[bin]]
name = "firm"
path = "src/main.rs"

[dependencies]
harness_core = { package = "firm-core", path = "../firm-core" }
harness_application = { package = "firm-application", path = "../firm-application" }
harness_runtime_contract = { package = "firm-runtime-contract", path = "../firm-runtime-contract" }
harness_runtime_host = { package = "firm-runtime-host", path = "../firm-runtime-host" }
harness_provider_codex = { package = "firm-provider-codex", path = "../firm-provider-codex" }
harness_provider_kimi = { package = "firm-provider-kimi", path = "../firm-provider-kimi", features = ["test-support"] }
harness_provider_pi = { package = "firm-provider-pi", path = "../firm-provider-pi" }
harness_store = { package = "firm-store", path = "../firm-store" }
harness_fabric = { package = "firm-fabric", path = "../firm-fabric" }
harness_governance = { package = "firm-governance", path = "../firm-governance" }
harness_provider_events = { package = "firm-provider-events", path = "../firm-provider-events" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
crossbeam = "0.8"
notify = "6.1"

[dev-dependencies]
harness_store = { package = "firm-store", path = "../firm-store", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
