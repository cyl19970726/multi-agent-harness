schema = "agent_harness.governance.v1"
doc_roots = [
    "README.md",
    "docs",
    "schemas",
    ".agents/skills",
    "examples",
    "apps",
]
skill_roots = [
    "skills",
    ".agents/skills",
]
max_lines = 500
# Maintained source files share one hard architectural ceiling. Generated,
# vendored, dependency, and build-output trees are excluded by the engine.
source_roots = ["crates", "apps", "scripts"]
source_max_lines = 1500
member_data_root = ".agents/data"

[registry]
path = "docs/registry.json"
schema = "agent_harness.docs_registry.v1"
required_fields = [
    "path",
    "ownerRole",
    "status",
    "lifecycle",
    "authorityClass",
    "implementationState",
    "truthRefs",
    "canonicalFor",
    "dependsOn",
    "machineConsumers",
    "reviewAfter",
    "lastVerifiedWith",
    "reorgTrigger",
]
allowed_statuses = [
    "idea",
    "planned",
    "stable",
    "deprecated",
    "archival",
]
allowed_lifecycles = [
    "volatile",
    "stable",
    "archival",
]
allowed_authority_classes = [
    "entry",
    "canonical_contract",
    "implementation_reference",
    "design_intent",
    "actual_evidence",
    "research",
    "historical_evidence",
]
allowed_implementation_states = [
    "design_only",
    "partial",
    "implemented",
    "verified",
]
allowed_truth_ref_kinds = [
    "schema",
    "store",
    "api",
    "ui",
    "test",
    "decision",
    "runtime_evidence",
]
core_docs = [
    "README.md",
    "docs/README.md",
    "docs/current/documentation-governance.md",
    "docs/current/product/prd.md",
    "docs/current/architecture/design-basis.md",
    "docs/current/architecture/architecture.md",
    "docs/current/operations/operations.md",
    "docs/current/architecture/schemas.md",
    "docs/decisions/README.md",
]
coverage_roots = [
    "docs/mental",
    "docs/current/dashboard/pages",
    "docs/current/integration",
    "plugins",
]
coverage_exclude = [
    "plugins/star-harness/skills/shared-references/agent-team-mental-model.md",
]

[retired_vocabulary]
terms = [
    "Goal System",
    "Task System",
    "Goal -> Task",
    "Vision/Goal/Task",
    "Goal/Task Workbench",
    "Commitment ledger",
    "Payment ledger",
    "Finance module",
    "Mission/Wave orchestration",
    "Company OS Docs",
    "CompanyOS",
    "Company OS",
    "Company Store",
    "Company Work",
    "Company Approval",
    "Approval ledger",
    "Mission Log",
    "AgentIdentity",
    "StandingAgent",
]
# Finance/CompanyOS vocabulary added when DOC-108 decommissioned the
# append-only writers (issue #323). Terms are phrase-scoped (not bare
# "Mission"/"Payment") so labeled history and legacy read-only docs
# keep their vocabulary.
allowed_paths = [
    "docs/current/operations/governance-engine.md",
    # Dated live-acceptance records are historical evidence by construction:
    # they narrate what a specific pre-cutover run did, in that run's
    # vocabulary. Their header states the date and the pre-DOC-108 scope.
    "docs/current/integration/live-agent-team-acceptance-2026-07-21.md",
]
context_markers = [
    "archive",
    "archived",
    "compatibility",
    "deprecated",
    "former",
    "historical",
    "legacy",
    "migration",
    "not active",
    "retired",
    "superseded",
]

# Retired skill names must never reappear under any skill_roots entry —
# including ignored or untracked local copies (the skills gate scans the
# filesystem). Each name is either archived under archive/skills/ or was
# deleted with its methodology relocated into
# docs/current/documentation-governance.md (bootstrap-project-workflow).
[retired_skills]
names = [
    "bootstrap-project-workflow",
    "company-org-operator",
    "company-work-operator",
    # Parked as parked-company-finance-operator-20260805 (ADR 0053), but the
    # retired NAME itself stays excluded: stray local copies carry it
    # (e.g. .agents/skills/company-finance-operator).
    "company-finance-operator",
    "parked-company-finance-operator-20260805",
    "company-docs-operator",
    "company-module-designer",
    "company-page-builder",
    "company-business-project-bootstrap",
    "connect-github-company-os",
    "dogfood-company-os",
    "orchestrate-mission-waves",
    "multi-agent-system-design",
]

[[document_invariants]]
name = "flat-team-placement-and-legacy-mission"
paths = [
    "AGENTS.md",
    "docs/mental/agent-firm-mental-model.md",
    "docs/decisions/0050-agent-team-work-board-and-message-boundary.md",
]
required_terms = [
    "flat AgentTeams",
    "immutable `node_id`",
]
forbidden_terms = [
    "recursive AgentTeams",
    "recursive AgentTeam Organization",
    "zero or more Agent Teams",
    "optional `machine_id`",
    "`machine_id` field on Agent Teams",
    "Every Team belongs to exactly one Mission",
    "No two AgentTeams may reference the same Mission",
]

[[document_invariants]]
name = "machine-node-daemon-authority"
paths = [
    "AGENTS.md",
    "docs/mental/agent-firm-mental-model.md",
    "docs/current/architecture/multi-team-supervisor-daemon.md",
]
required_terms = [
    "one machine-scoped NodeDaemon",
    "`NodeDaemonLease` is machine-scoped",
    "all local Teams",
    "registered Execution Spaces",
    "never scoped to one Execution Space",
]
forbidden_terms = [
    "one daemon per Team",
    "one daemon per TeamRun",
    "`NodeDaemonLease` is scoped to one Execution Space",
]
