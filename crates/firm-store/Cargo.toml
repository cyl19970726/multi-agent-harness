[package]
name = "firm-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
firm-application = { path = "../firm-application" }
firm-core = { path = "../firm-core" }
firm-fabric = { path = "../firm-fabric" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# The crate's own integration tests under `tests/` link the non-test build, so
# the `cfg(any(test, feature = "test-support"))` fixtures they use (#993) are
# only visible to them if the feature is unified on for the test build — which
# this self dev-dependency is the standard spelling of.
[dev-dependencies]
firm-store = { path = ".", features = ["test-support"] }
