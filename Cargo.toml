[workspace]
members = [
  "crates/firm-core",
  "crates/firm-store",
  "crates/firm-workflow",
  "crates/firm-governance",
  "crates/firm-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cyl19970726/multi-agent-harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
