name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm acceptance:skill-install
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Runtime integration discovers the repository-owned provider SDK from
      # node_modules. Freeze that dependency before any Rust integration test.
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Provider lifecycle integration tests intentionally exercise process-local
      # supervisors and live control handles. Serialize them so the release gate
      # measures protocol behavior instead of host scheduling contention.
      - run: cargo test -- --test-threads=1
      # Doc/skill governance gate, native in the binary (replaces the retired
      # node check-doc-*/check-skills scripts). The cargo-test self-host test
      # also covers this; this is the explicit, legible CLI gate.
      - run: cargo run -q -p firm-cli -- governance check
