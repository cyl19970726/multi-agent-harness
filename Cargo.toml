[workspace]
members = [
  "crates/firm-core",
  "crates/firm-application",
  "crates/firm-runtime-contract",
  "crates/firm-runtime-host",
  "crates/firm-provider-codex",
  "crates/firm-provider-events",
  "crates/firm-fabric",
  "crates/firm-store",
  "crates/firm-governance",
  "crates/firm-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cyl19970726/multi-agent-harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = "0.3"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
fs2 = "0.4"
hmac = "0.12"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
x509-parser = "0.18"
