[workspace]
members = [
  "crates/firm-core",
  "crates/firm-fabric",
  "crates/firm-store",
  "crates/firm-workflow",
  "crates/firm-governance",
  "crates/firm-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cyl19970726/multi-agent-harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hmac = "0.12"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
